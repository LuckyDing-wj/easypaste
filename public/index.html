<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyPaste</title>
  <link rel="icon" href="data:,">
  <script src="assets/theme.js"></script>
  <style>
    :root {
      color-scheme: light;
      --page: #faf9f5;
      --surface: #faf9f5;
      --surface-raised: #fffdf8;
      --surface-muted: #f0eee6;
      --text: #141413;
      --muted: #73726c;
      --border: #dedcd1;
      --primary: #c96442;
      --primary-hover: #b65333;
      --primary-active: #9f452a;
      --primary-soft: rgba(201, 100, 66, 0.16);
      --on-primary: #141413;
      --success: #629987;
      --warning: #b45309;
      --danger: #b53333;
      --danger-soft: #f3dbcf;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --page: #141413;
      --surface: #141413;
      --surface-raised: #1f1e1d;
      --surface-muted: #262624;
      --text: #faf9f5;
      --muted: #b0aea5;
      --border: #3d3d3a;
      --primary: #d97757;
      --primary-hover: #e08a6e;
      --primary-active: #c46849;
      --primary-soft: rgba(217, 119, 87, 0.20);
      --on-primary: #141413;
      --success: #7ab49f;
      --warning: #e3b65e;
      --danger: #df6666;
      --danger-soft: rgba(181, 51, 51, 0.18);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background: var(--page);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      height: 100dvh;
    }
    .container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--page);
      padding: clamp(1rem, 2vw, 2rem);
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-shrink: 0;
    }
    h1 {
      font-size: 1.35rem;
      line-height: 1.2;
      color: var(--text);
      font-weight: 700;
    }
    .theme-switcher {
      display: inline-flex;
      gap: 0.25rem;
      align-items: center;
      padding: 0.25rem;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .theme-option {
      min-height: 36px;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 0.85rem;
      border-color: transparent;
    }
    .theme-option:hover {
      background: var(--surface-raised);
      color: var(--text);
      border-color: transparent;
    }
    .theme-option[aria-pressed="true"] {
      background: var(--surface-raised);
      color: var(--text);
      border-color: var(--border);
      box-shadow: 0 1px 2px rgba(20, 20, 19, 0.08);
    }
    textarea {
      width: 100%;
      flex: 1 1 0;
      min-height: 0;
      background: var(--surface-raised);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 1rem;
      line-height: 1.6;
      resize: none;
      outline: none;
      box-shadow: inset 0 1px 2px rgba(20, 33, 29, 0.04);
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }
    textarea::placeholder {
      color: var(--muted);
    }
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft), inset 0 1px 2px rgba(20, 33, 29, 0.04);
    }
    .unlock-panel {
      width: min(100%, 28rem);
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1.25rem;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(20, 20, 19, 0.08);
    }
    .unlock-title {
      font-size: 1.1rem;
      line-height: 1.35;
      font-weight: 700;
    }
    .unlock-text {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .unlock-field {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    label {
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 650;
    }
    input {
      min-height: 44px;
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
      font: inherit;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }
    .unlock-actions {
      display: flex;
      gap: 0.625rem;
      align-items: center;
      flex-wrap: wrap;
    }
    #unlockBtn {
      background: var(--primary);
      color: var(--on-primary);
    }
    #unlockBtn:hover { background: var(--primary-hover); }
    #unlockBtn:active { background: var(--primary-active); }
    .unlock-msg {
      min-height: 1.2em;
      color: var(--danger);
      font-size: 0.9rem;
    }
    .editor-panel {
      display: flex;
      flex: 1 1 0;
      min-height: 0;
      flex-direction: column;
    }
    [hidden] {
      display: none !important;
    }
    .actions {
      margin-top: 1rem;
      display: flex;
      gap: 0.625rem;
      align-items: center;
      flex-shrink: 0;
    }
    button {
      min-height: 44px;
      background: var(--surface-muted);
      color: var(--text);
      border: 1px solid transparent;
      padding: 0.65rem 1.35rem;
      font-size: 0.95rem;
      font-family: inherit;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 650;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease;
    }
    #saveBtn {
      background: var(--primary);
      color: var(--on-primary);
    }
    #saveBtn:hover { background: var(--primary-hover); }
    #saveBtn:active { background: var(--primary-active); }
    button:hover {
      background: var(--surface-raised);
      border-color: var(--border);
    }
    button:active {
      transform: translateY(1px);
    }
    button:focus-visible {
      outline: 3px solid var(--primary-soft);
      outline-offset: 2px;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }
    #clearBtn:hover {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }
    button.saved { background: var(--success); color: #fff; }
    .msg {
      font-size: 0.9rem;
      color: var(--success);
      min-height: 1.2em;
    }
    .error { color: var(--danger); }
    .info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.45rem;
      flex-shrink: 0;
    }
    .saved { color: var(--success); }
    .unsaved { color: var(--warning); }
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      height: 100vh;
      height: 100dvh;
      background: var(--page);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      font-size: 1.2rem;
      color: var(--primary);
    }
    @media (max-width: 480px) {
      .container { padding: 1rem; }
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.75rem;
      }
      .theme-switcher { width: 100%; }
      .theme-option { flex: 1; padding-inline: 0.5rem; }
      h1 { font-size: 1.2rem; }
      textarea { font-size: 16px; }
      .unlock-panel { width: 100%; padding: 1rem; }
      .actions { flex-wrap: wrap; }
      button { padding: 0.7rem 1.2rem; font-size: 0.95rem; }
      .msg { width: 100%; margin-top: 0.3rem; }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">加载中...</div>
  <div class="container">
    <div class="topbar">
      <h1>EasyPaste</h1>
      <div class="theme-switcher" role="group" aria-label="主题模式">
        <button class="theme-option" type="button" data-theme-option="system" aria-pressed="true">跟随系统</button>
        <button class="theme-option" type="button" data-theme-option="light" aria-pressed="false">日间</button>
        <button class="theme-option" type="button" data-theme-option="dark" aria-pressed="false">夜间</button>
      </div>
    </div>

    <form class="unlock-panel" id="unlockPanel">
      <div>
        <div class="unlock-title">输入访问码</div>
        <p class="unlock-text">验证通过后再加载剪切板内容。</p>
      </div>
      <div class="unlock-field">
        <label for="accessCode">访问码</label>
        <input id="accessCode" type="password" autocomplete="current-password" inputmode="text">
      </div>
      <div class="unlock-actions">
        <button id="unlockBtn" type="submit">解锁</button>
        <span class="unlock-msg" id="unlockMsg" aria-live="polite"></span>
      </div>
    </form>

    <div class="editor-panel" id="editorPanel" hidden>
      <textarea id="content" placeholder="加载中..."></textarea>
      <div class="info">
        <span id="stats">0 字 · 0 行</span>
        <span id="updatedAt"></span>
      </div>
      <div class="actions">
        <button id="saveBtn">保存</button>
        <button id="copyBtn">复制</button>
        <button id="clearBtn">清空</button>
        <span class="msg" id="msg"></span>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
